[project]
name = "adk-training"
version = "0.1.0"
description = "ADK 2.0 3-hour hands-on workshop: single agent to Workflow, deployed to Cloud Run"
requires-python = ">=3.11"
# Local dev / Cloud Shell 用の依存。
# - `mcp` extra : McpToolset / StreamableHTTPConnectionParams (agent runtime でも必要)
# - `gcp` extra : `adk deploy agent_engine` が依存する google-cloud-aiplatform 等 (デプロイ CLI 専用)
# Agent Engine の sandbox runtime では `app/requirements.txt` だけがインストールされるため、
# あちらは意図的に `mcp` のみとしている (デプロイイメージに不要な依存を含めない)。
dependencies = [
    "google-adk[mcp,gcp]>=2.1.0,<3",
    "python-dotenv>=1,<2",
]

[tool.uv]
package = false

# 受講者環境の PIP_INDEX_URL / 企業内 Python registry の影響を受けないよう、
# PyPI を明示的にデフォルト index に固定する。
# (個別 registry を使いたい場合はこのブロックを書き換える)
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true
